name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check project exists
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "package.json not found yet. Skipping build/test until the app is initialized."
          fi

      - name: Setup Node
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate dependency lock
        if: steps.project.outputs.exists == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lockfile
        if: steps.project.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Install dependencies
        if: steps.project.outputs.exists == 'true'
        run: npm install

      - name: Check test script
        if: steps.project.outputs.exists == 'true'
        id: test-script
        shell: bash
        run: |
          if npm run | grep -q " test"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No test script found yet. Skipping tests until test tooling is initialized."
          fi

      - name: Test
        if: steps.project.outputs.exists == 'true' && steps.test-script.outputs.exists == 'true'
        run: npm test -- --run

      - name: Build
        if: steps.project.outputs.exists == 'true'
        run: npm run build
